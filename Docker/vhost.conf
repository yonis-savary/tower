server {
    listen 80;
    server_name localhost;

    root /var/www/Public;
    index index.php index.html;

    # Above a documentation image of 5 MiB in base64 (about 7 MB), and within the 8M post_max_size of PHP :
    # a slightly larger file gets the explanation of Tower, not a bare 413 of nginx
    client_max_body_size 8m;

    # Resolved at request time through Docker's DNS : a redeployed php-fpm container may get another IP
    resolver 127.0.0.11 valid=10s;
    set $php_upstream php-fpm:9000;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ \.php$ {
        try_files $fastcgi_script_name =404;
        include fastcgi_params;
        fastcgi_pass $php_upstream;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
