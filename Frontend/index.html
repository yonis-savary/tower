<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- favicon.ico first : bookmarks, history and older browsers need a raster icon, the SVG wins where supported -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#2190FF" />
    <!-- viewport-fit=cover : the bars of the phone layout pad themselves with the safe areas (notch, home indicator) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Tower</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
